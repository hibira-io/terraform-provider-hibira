# Publishes a release for the Terraform Registry: run it from the Actions
# tab with a version (it tags main), or push a v* tag. Don't create the
# release by hand on GitHub: the Registry reads it as soon as it is
# published, before goreleaser has uploaded the files.
# Needs the repository secrets GPG_PRIVATE_KEY (ASCII-armored) and
# GPG_PASSPHRASE (repository or organization secrets); the matching public key must be added to the Registry.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as v0.1.0'
        required: true
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v0.1.0"; exit 1; }
          # A re-run after a failed release finds the tag already there.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION is already tagged"
            git checkout -q "$VERSION"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check the GPG secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::The GPG_PRIVATE_KEY secret is empty or not shared with this repository"; exit 1; }
          [ -n "$GPG_PASSPHRASE" ] || { echo "::error::The GPG_PASSPHRASE secret is empty or not shared with this repository"; exit 1; }
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
